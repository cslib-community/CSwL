name = "CSwL"
version = "0.1.0"
# `CSwLCompat` goes here (and not only as a `[[lean_lib]]`) because nothing
# in `cswl`'s `import` closure (which only reaches `CSwL.IntroL`) reaches
# it -- without this, a plain `lake build` doesn't recompile that module
# after editing it, and an error in it would only show up when a chapter
# actually used `import CSwLCompat`.
defaultTargets = ["cswl", "CSwLCompat"]

# Docstrings and module docstrings in Verso format (not Markdown): enables
# the `{name}`f``, `{syntax term}`...``, etc. markup, which turns into a
# link to the definition in the web output. Applies to `/-- ... -/` and to
# `/-! ... -/` (`doc.verso.module` falls back to `doc.verso` when not given
# explicitly).
leanOptions = {doc.verso = true}

[[lean_lib]]
name = "CSwL"
# `doc.verso.suggestions` turns off the linter that, for every inline
# `code`, suggests a more specific "role" (`{lean}`, `{name}`,
# `{syntax term}`, ...). Without it there are ~50 warnings per build across
# the chapters -- this is what Tao turns off with
# `set_option doc.verso.suggestions false` at the top of every file.
# It lives here, not next to `doc.verso` above, because in TOML the two
# keys would collide in the same table (`doc.verso` cannot be both a bool
# and a table at the same time). Lake merges both: a lib's `leanOptions` =
# package ++ lib.
leanOptions = {doc.verso.suggestions = false}

# Exercises live inside `CSwL/ChapterNN.lean`, at the position of the book
# section they correspond to -- there is no separate `Exercises` lib
# anymore. In `CSwL/` a `sorry` is accepted, left there on purpose as an
# example to solve in class; `lake build`'s own warning is what serves as
# the to-do list.
#
# Answer keys live in `Solutions/`, which `.gitignore` forbids versioning
# (the repository is public). Since it isn't versioned, it has no lib
# declared here: to check an answer key, `lake env lean
# Solutions/Solution02.lean`.

# The book's own metadata layer (the `student`/`solutions`/`terse`/
# `grading` variants, `:::exercise`, `solution!`, `::::quiz`,
# `:::gradeTheorem`, and the extractor that generates each variant's
# `.lean` files). Adapted from `sf-in-lean/SFLMeta/*`; see `CSwLMeta.lean`.
#
# `doc.verso = false` undoes, only for this library, the package-level
# `doc.verso = true` above: the infrastructure modules use `/-! ## ... -/`
# as an internal file divider, and with Verso markup on, a module's first
# heading has to be `#` -- a rule that makes sense for a book chapter and
# none for a code file. There is no prose to publish here.
[[lean_lib]]
name = "CSwLMeta"
leanOptions = {doc.verso = false}

# Bibliography as Lean `def`s (what used to be `references.bib`): a
# mistyped key in `{citep Bib.xyz}[]` becomes a compile error, not a
# dangling `[Xyz]` in the HTML.
[[lean_lib]]
name = "Bib"
leanOptions = {doc.verso = false}   # infrastructure, like the `CSwLMeta` lib

# `sf_experiment`/`sf_expect_failure`/`sf_expect_failure?` macros used by
# the ` ```lean -keep ` and ` ```lean +error ` fences (see
# `CSwLMeta/Save/Extract.lean`, `walkBlock`, and `CSwLMeta/Save/Lean.lean`,
# `LeanSaved.Data.extractionMode`).
# Its own module (not inside `CSwLMeta`) because it is also copied,
# verbatim, into every extracted Lean project under `_out/<variant>/lean/`
# -- see `CSwLMeta/Save/Project.lean`, `bundleCompatSeed`.
# `doc.verso = false`, like `CSwLMeta`/`Bib`: the docstrings use
# `/-! ## ... -/` as an internal divider and ```lean``` example blocks
# inside `/-- ... -/` (for the `sf_experiment`/`sf_expect_failure` macros
# themselves), and Verso markup rejects both (a `##`-level heading with no
# `#` before it, "Incorrect header nesting"; and every identifier turns
# into a role suggestion). This is not book content, it's infrastructure
# like the other two.
[[lean_lib]]
name = "CSwLCompat"
leanOptions = {doc.verso = false}

# Root of the book in the `Manual` genre: a `#doc (Manual)` that includes
# one chapter per `{include CSwL.ChapterNN}`. Only chapter 1 has been
# converted so far; the rest remain in the `Literate` genre until converted
# one by one.
[[lean_lib]]
name = "Book"

[[lean_exe]]
name = "cswl"
root = "Main"

# Builds the book: `lake exe cswl-book <variant>` writes
# `_out/<variant>/{html,lean}`. Use the `Makefile` (`make student`, ...).
# `lean4-autograder-main` does NOT go here on purpose: it requires the
# `v4.33.0` toolchain and collides with the Mathlib that `cslib` brings
# (measured: breaks `lake exe cache get`). It is a dependency only of the
# standalone Lake project that `CSwLMeta/Save/Project.lean` generates under
# `_out/grading/lean/`.
[[lean_exe]]
name = "cswl-book"
root = "BookMain"
leanOptions = {doc.verso = false}   # infrastructure, like the `CSwLMeta` lib

# Revision pinned for the same reason as `verso` and `doc-gen4` below:
# without `rev`, the `[[require]]` followed `main`, and any `lake update`
# drags the project's toolchain to whatever `cslib`'s `main` requires at
# that moment (happened on 08/14: it moved to `v4.34.0-rc1`). This is the
# revision `lake-manifest.json` already resolved to -- pinning it changes
# nothing about what compiles today.
[[require]]
name = "cslib"
scope = "leanprover"
rev = "3951377e5a3f5772737f11cd62bc5bb6a72f95d1"

# Verso: generates the book's web (HTML) version, `Manual` genre
# (`Book.lean`, target `lake exe cswl-book <variant>` -- see `Makefile`)
# and the `lake exe verso-serve` that serves `_out/` locally
# (`verso-serve.toml`). The `Literate` genre (`:literateHtml`,
# `build-web.sh`) was retired on 08/16.
# Revision pinned because verso's `lean-toolchain` has to match ours
# (v4.33.0-rc2); `main` may move ahead to a newer toolchain.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "4ac03644305a17f32139766b9ceb625ad046b85e"

# doc-gen4: generates the API documentation (the reference: one HTML page
# per declaration, with type, docstring, and links). Target: `lake build
# CSwL:docs`, output under `.lake/build/doc/`. It no longer has a script of
# its own since `build-web.sh` was retired (08/16); it stayed out of active
# use until the scope question (`CSwL:docs` only documents the empty lib;
# `Book:docs` brings in all of Mathlib) is resolved -- see
# https://github.com/emap-nlp/CSwL/issues/1.
#
# Tao declares this dependency only in the "dev" environment
# (`meta if get_config? env = some "dev" then require ...` in
# `lakefile.lean`), so that someone who only wants to build the book
# doesn't download doc-gen4. This has NO equivalent in TOML: `[[require]]`
# only accepts `name`/`scope`/`git`/`rev`/`path`/`version`/`options` --
# there is no condition field or `meta if`. Staying unconditional (and
# keeping the lakefile declarative) costs, measured:
#   - four extra repositories cloned once (doc-gen4, leansqlite,
#     UnicodeBasic, BibtexQuery), without touching the other pins already
#     fixed;
#   - `lake build` compiles leansqlite's native objects (~2 s, once);
#   - doc-gen4 itself is only compiled when the `:docs` target is
#     requested.
#
# Revision pinned to the tag that matches our `lean-toolchain`
# (v4.33.0-rc2). Being unconditional, a broken `main` would break
# everyone's build.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.33.0"

# Mathlib already comes in transitively via `cslib`, but without a direct
# `[[require]]` here Lake does not prioritize Mathlib's version choices for
# shared dependencies (`plausible`, `Cli`) -- it stays pinned to older
# versions of those two, and `lake exe cache get` refuses to fetch
# Mathlib's precompiled cache because the hashes wouldn't match. Needs to
# stay last in the file.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

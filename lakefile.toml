name = "CSwL"
version = "0.1.0"
defaultTargets = ["cswl"]

# Docstrings e module docstrings em formato Verso (e não Markdown): habilita a
# marcação `{name}`f``, `{syntax term}`...``, etc., que na saída web vira link
# para a definição. Vale para `/-- ... -/` e para `/-! ... -/`
# (`doc.verso.module` cai para `doc.verso` quando não é dada explicitamente).
leanOptions = {doc.verso = true}

[[lean_lib]]
name = "CSwL"
# `doc.verso.suggestions` desliga o linter que, para cada `código` inline, sugere
# um "role" mais específico (`{lean}`, `{name}`, `{syntax term}`, ...). Sem ele são
# ~50 avisos por build nos capítulos — é o que o Tao desliga com
# `set_option doc.verso.suggestions false` no topo de cada arquivo.
# Ele fica aqui, e não junto de `doc.verso` acima, porque em TOML as duas chaves
# colidiriam na mesma tabela (`doc.verso` não pode ser bool e tabela ao mesmo
# tempo). Lake soma as duas: `leanOptions` da lib = pacote ++ lib.
leanOptions = {doc.verso.suggestions = false}

# Os exercícios ficam dentro de `CSwL/ChapterNN.lean`, na posição da seção do
# livro a que correspondem — não há mais uma lib `Exercises` separada. Em
# `CSwL/` um `sorry` é aceito, deixado de propósito como exemplo a resolver em
# aula; é o próprio aviso do `lake build` que serve de lista do que falta.
#
# Os gabaritos ficam em `Solutions/`, que o `.gitignore` proíbe versionar (o
# repositório é público). Por não ser versionado, não tem lib declarada aqui:
# para conferir um gabarito, `lake env lean Solutions/Solution02.lean`.

# Camada própria de metadados do livro (variantes `student`/`solutions`/`terse`/
# `grading`, `:::exercise`, `solution!`, `::::quiz`, `:::gradeTheorem` e o
# extrator que gera os `.lean` de cada variante). Adaptada de
# `sf-in-lean/SFLMeta/*`; ver `CSwLMeta.lean`.
#
# `doc.verso = false` desfaz, só para esta biblioteca, o `doc.verso = true` do
# pacote acima: os módulos de infraestrutura usam `/-! ## ... -/` como divisória
# interna de arquivo, e com a marcação Verso ligada o primeiro cabeçalho de um
# módulo tem de ser `#` — regra que faz sentido para um capítulo do livro e
# nenhum para um arquivo de código. Aqui não há prosa a publicar.
[[lean_lib]]
name = "CSwLMeta"
leanOptions = {doc.verso = false}

# Bibliografia como `def`s Lean (o que era `references.bib`): uma chave errada
# em `{citep Bib.xyz}[]` vira erro de compilação, não `[Xyz]` pendurado no HTML.
[[lean_lib]]
name = "Bib"
leanOptions = {doc.verso = false}   # infraestrutura, como a lib `CSwLMeta`

# Raiz do livro no gênero `Manual`: um `#doc (Manual)` que inclui um capítulo
# por `{include CSwL.ChapterNN}`. Só o cap. 1 foi convertido até agora; os
# demais continuam no gênero `Literate` até serem convertidos, um a um.
[[lean_lib]]
name = "Book"

[[lean_exe]]
name = "cswl"
root = "Main"

# Gera o livro: `lake exe cswl-book <variante>` escreve
# `_out/<variante>/{html-multi,lean}`. Use o `Makefile` (`make student`, ...).
# O `lean4-autograder-main` NÃO entra aqui de propósito: ele exige o toolchain
# `v4.33.0` e colide com o Mathlib que o `cslib` traz (medido: quebra o
# `lake exe cache get`). Ele é dependência apenas do projeto Lake autônomo que
# `CSwLMeta/Save/Project.lean` gera em `_out/grading/lean/`.
[[lean_exe]]
name = "cswl-book"
root = "BookMain"
leanOptions = {doc.verso = false}   # infraestrutura, como a lib `CSwLMeta`

# Revisão fixada pelo mesmo motivo que `verso` e `doc-gen4` abaixo: sem `rev`,
# o `[[require]]` seguia `main`, e um `lake update` qualquer arrasta o toolchain
# do projeto para o que o `main` do `cslib` exigir no momento (aconteceu em
# 14/08: foi para `v4.34.0-rc1`). Esta é a revisão que o `lake-manifest.json` já
# resolvia — fixá-la não muda nada do que hoje compila.
[[require]]
name = "cslib"
scope = "leanprover"
rev = "3951377e5a3f5772737f11cd62bc5bb6a72f95d1"

# Verso: gera a versão web (HTML) do livro, gênero `Manual` (`Book.lean`,
# alvo `lake exe cswl-book <variante>` — ver `Makefile`) e o `lake exe
# verso-serve` que serve `_out/` localmente (`verso-serve.toml`). O gênero
# `Literate` (`:literateHtml`, `build-web.sh`) foi aposentado em 16/08.
# Revisão fixada porque o `lean-toolchain` do verso tem de bater com o nosso
# (v4.33.0-rc2); `main` pode avançar para um toolchain mais novo.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "4ac03644305a17f32139766b9ceb625ad046b85e"

# doc-gen4: gera a documentação de API (a referência: um HTML por declaração,
# com tipo, docstring e links). Alvo: `lake build CSwL:docs`, saída em
# `.lake/build/doc/`. Não tem mais script próprio desde que o `build-web.sh`
# foi aposentado (16/08); ficou fora de uso ativo até a questão de escopo
# (`CSwL:docs` só documenta a lib vazia; `Book:docs` traz Mathlib inteiro)
# ser resolvida — ver https://github.com/emap-nlp/CSwL/issues/1.
#
# O Tao declara esta dependência só no ambiente "dev"
# (`meta if get_config? env = some "dev" then require ...` no `lakefile.lean`),
# para que quem só quer compilar o livro não baixe o doc-gen4. Isso NÃO tem
# equivalente em TOML: `[[require]]` aceita apenas `name`/`scope`/`git`/`rev`/
# `path`/`version`/`options` — não há campo de condição nem `meta if`. Ficar
# incondicional (e manter o lakefile declarativo) custa, medido:
#   - quatro repositórios extras clonados uma vez (doc-gen4, leansqlite,
#     UnicodeBasic, BibtexQuery), sem mexer nas revisões já fixadas das outras;
#   - `lake build` compila os objetos nativos do leansqlite (~2 s, uma vez só);
#   - o doc-gen4 em si só é compilado quando o alvo `:docs` é pedido.
#
# Revisão fixada na tag que casa com o nosso `lean-toolchain` (v4.33.0-rc2).
# Sendo incondicional, um `main` quebrado quebraria o build de todo mundo.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.33.0"

# Mathlib já entra transitivamente via `cslib`, mas sem um `[[require]]` direto
# aqui o Lake não dá prioridade às escolhas de versão do Mathlib para
# dependências compartilhadas (`plausible`, `Cli`) — fica pinado a versões mais
# antigas dessas duas, e `lake exe cache get` recusa buscar cache pré-compilado
# do Mathlib porque os hashes não bateriam. Precisa ficar por último no arquivo.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

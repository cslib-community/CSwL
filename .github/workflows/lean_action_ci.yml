# Verificação rápida: o projeto compila?
#
# Só em pull request (e à mão). Os pushes em `main` são cobertos por
# `pages.yml`, que compila tudo e publica o site — dois workflows fazendo o
# mesmo build no mesmo evento seria desperdício de runner.
name: Lean Action CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

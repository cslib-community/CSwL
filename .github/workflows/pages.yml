# Builds the `student` and `terse` variants of the book, publishes `terse`
# to GitHub Pages, and publishes both as the `latest` release.
#
#   <pages>/            the `terse` variant (Verso, `Manual` genre)
#
# Students read the `student` variant, which `github.com/emap-nlp/book`
# serves; this site carries `terse`, the lecture cut used in class. Neither
# shows answer keys: `solutions` and `grading` are never published. API docs (doc-gen4)
# are intentionally left out for now — see the scope issue tracked at
# https://github.com/cslib-community/CSwL/issues/1.
#
# Base: `.lake/packages/verso/gh-setup/verso-literate-pages.yml` (the
# template from `lake exe verso setup-literate`), adapted to this repo's
# `Manual`-genre build (`Makefile`, `CSwLMeta/Run.lean`) instead of the
# retired `Literate` genre; cache scheme from Tao's workflow at
# https://github.com/teorth/analysis.

name: GitHub Pages

on:
  push:
    branches: [main]
  # Allows triggering the deploy by hand, from the "Actions" tab.
  workflow_dispatch:

# Permissions required by the Pages deploy:
#   contents: read   — to check out the repository
#   pages: write     — to publish
#   id-token: write  — OIDC authentication with the Pages API (short-lived
#                      tokens instead of permanent secrets)
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because canceling a
# deploy mid-flight could leave the published site in an inconsistent
# state: the new push waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs elan and the toolchain named in `lean-toolchain`.
      # `build`/`test` are off: the targets are requested explicitly below.
      # `use-mathlib-cache` is off because `lake exe cache get` runs after
      # restoring `.lake` (otherwise it would download all of Mathlib
      # before the restore, on every run).
      # `use-github-cache` is off because the cache is handled in the steps
      # below.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: false

      # The cache is handled by hand, not by `lean-action`, because that
      # action saves the cache BEFORE the site is generated: Verso's
      # artifacts would never be cached.
      - name: Restore Lake cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      # A half-cached package (with no usable `.git`) makes Lake fail to
      # resolve dependencies; it's cheaper to re-clone.
      - name: Remove corrupted cached packages
        run: |
          if [ -d .lake/packages ]; then
            find .lake/packages -mindepth 1 -maxdepth 1 -type d | while read -r package; do
              if ! git -C "$package" rev-parse HEAD >/dev/null 2>&1; then
                echo "Removing corrupted cached package: $package"
                rm -rf "$package"
              fi
            done
          fi

      # Downloads Mathlib's precompiled `.olean`s. Without this the build
      # blows past the runner's time budget.
      - name: Mathlib cache
        run: lake exe cache get

      - name: Build the book (student and terse variants)
        id: build-site
        run: |
          lake build cswl-book
          lake exe cswl-book student
          lake exe cswl-book terse
          mkdir -p _site
          cp -r _out/terse/html/. _site

      - name: Save Lake cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Also handed to the `release` job below — see that job's comment.
      # `include-hidden-files`, because each generated project's `.gitignore`
      # is what keeps `.lake/` out of the students' commits.
      - name: Upload the variants (lean + html)
        uses: actions/upload-artifact@v4
        with:
          name: variants
          path: |
            _out/student
            _out/terse
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only `main` goes live: a `workflow_dispatch` triggered on another
    # branch builds (useful to check), but doesn't publish.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the variants as the `latest` release of this repo, one
  # `<variant>-lean.tar.gz` and one `<variant>-html.tar.gz` each, plus
  # `commit.txt`, the CSwL commit they were built from.
  # `github.com/emap-nlp/book` fetches `student-*` from it (a public
  # download, no credentials needed) and republishes it — see that repo's
  # `.github/workflows/sync.yml`. `latest` is a moving tag: each run deletes
  # and recreates it, so there is always one place to look.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: variants
          path: _out

      - name: Package the variants
        run: |
          echo "${{ github.sha }}" > commit.txt
          for variant in student terse; do
            for part in lean html; do
              tar -czf "$variant-$part.tar.gz" --exclude=.lake -C "_out/$variant/$part" .
            done
          done

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete student-latest --yes --cleanup-tag || true
          gh release create latest ./*.tar.gz commit.txt \
            --title "Latest build" \
            --notes "The student and terse variants, built from commit ${{ github.sha }}."

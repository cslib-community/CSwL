# Configuração da saída web (Verso, modo "literate"): o site é gerado dos
# mesmos arquivos `.lean` que os alunos editam no VS Code.
#
#     ./build-web.sh   # gera   .lake/build/literate-html/
#     ./serve.py       # serve  http://localhost:8000/
#
# Referência: https://verso.lean-lang.org/doc/latest/literate/
#
# ATENÇÃO à ordem: em TOML toda chave "solta" tem de vir ANTES da primeira
# tabela (`[...]` ou `[[...]]`), senão ela passa a pertencer àquela tabela e é
# silenciosamente ignorada aqui.

# Página inicial: a raiz da biblioteca, que apresenta o projeto. Sem isso o
# Verso gera um índice automático que lista os nomes crus dos módulos
# (`CSwL.Chapter02`) em vez dos títulos configurados abaixo.
landing_page = "CSwL"

# Andaime que não interessa ao leitor do livro. `open` fica visível de
# propósito: é conteúdo Lean, não infraestrutura.
hide_commands = ["import", "set_option", "namespace", "section", "end"]

# Comandos cuja saída aparece logo abaixo do código.
show_output = ["#eval", "#check", "#print", "#reduce"]

# Os docstrings `/-- ... -/` dos capítulos são prosa explicativa: saem como
# texto corrido entre os blocos de código, não dentro deles.
docstrings_as_text = true

# O alvo padrão do lakefile é o executável `cswl`; aqui dizemos que o site é
# feito da biblioteca `CSwL` (um módulo por capítulo do livro).
[[targets]]
library = "CSwL"

# Ordem dos capítulos na navegação: a numérica, não a alfabética.
[order_children]
"CSwL" = [
  "CSwL.Chapter01",
  "CSwL.Chapter02",
  "CSwL.Chapter03",
]

# `title` é o rótulo na navegação e no `<title>` da aba; sem ele o Verso usa o
# nome cru do módulo (`CSwL.Chapter02`). O `<h1>` da página vem do `# ...` do
# module docstring do próprio arquivo — mantenha os dois em sincronia ao
# renomear um capítulo.
[modules."CSwL"]
title = "Apresentação"
show_imports = false

[modules."CSwL.Chapter01"]
title = "1. O estudo formal da língua natural"
url = "cap01"

[modules."CSwL.Chapter02"]
title = "2. Programação funcional"
url = "cap02"

[modules."CSwL.Chapter03"]
title = "3. Funções, tipos e abstração"
url = "cap03"

[metadata]
title = "Semântica computacional com Lean"
description = "Tradução para Lean de van Eijck & Unger, Computational Semantics with Functional Programming (CUP, 2010)."

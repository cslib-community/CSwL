  bangu-proof: bangu-form
  pl-consequence: implies-from-list
  ex-fol-entails: ex-fol-implies-from-list
  help-defeat: check-sentence

sections:

  CSwFP/1:
    1.1–1.6: IntroCS
    1.7 Overview of the Book: omitted
    1.8 Further Reading: omitted

  CSwFP/2:
    2.1 Sets and Set Notation: Sets
    2.2 Relations: Sets
    2.3 Functions:
      to: IntroL
      why: In Lean `A → B` is primitive, so functions come with the language.
        That a function is a functional relation becomes a theorem in Sets.
    2.4 Lambda calculus:
      to: IntroL
      why: With Lean already on screen, lambda calculus is the theory of what
        the reader has just written. Its linguistic example is dropped, with 2.5.
    2.5 Types in Grammar and Computation:
      to: dropped
      why: 6.1 makes the same point in English, that a proper name translates
        as λP ↦ P g. Making it twice would fragment the presentation.
    2.6 Functional Programming:
      to: absorbed
      why: It bridges to a programming language the reader has already seen.
    2.7 Further reading: omitted

  CSwFP/3:
    3.1 The Programming Language Haskell: IntroL, merged with 3.2
    3.2 Using the Book Code: IntroL, merged with 3.1
    3.3 First Experiments: IntroL
    3.4 Type Polymorphism: IntroL
    3.5 Recursion: IntroL
    3.6 List Types and List Comprehension: IntroL
    3.7 List processing with map and filter: IntroL
    3.8 Function Composition, Conjunction, Disjunction, Quantification: IntroL
    3.9 Type Classes: IntroL
    3.10 Strings and Texts: IntroL
    3.11 Finnish Vowel Harmony:
      to: Morphology
      why: Split in two, FinnishVowelHarmony and SwedishPlural.
    3.12 Identifiers in Haskell: omitted
    3.13 User-defined Data Types and Pattern Matching:
      to: IntroL
      why: Its Subject/Predicate example is dropped, so that no fragment of
        natural language appears before the one English builds.
    3.14 Application, Representing Phonemes: Morphology
    3.15 Further Reading: omitted

  CSwFP/4:
    4.1 Grammars for Games:
      to: SeaBattle
      why: Together with 5.1, syntax and semantics in one chapter. The
        Mastermind grammar is dropped with 5.4.
    4.2 A Fragment of English: English
    4.3 A Language for Talking about Classes:
      to: InfEngine
      why: Together with 5.7, and after Sets, since the language is about sets.
    4.4 Propositional Logic: Logic/PL
    4.5 Predicate Logic: Logic/FOL
    4.6 Predicate Logical Formulas in Haskell: Logic/FOL
    4.7 Adding Function Symbols: Logic/FOL
    4.8 Further Reading: omitted

  CSwFP/5:
    5.1 Semantics of Sea Battle: SeaBattle
    5.2 Semantics of Propositional Logic: Logic/PL, merged with 5.3
    5.3 Propositional Reasoning in Haskell: Logic/PL, merged with 5.2
    5.4 Semantics of Mastermind:
      to: dropped
      why: Disconnected from Sea Battle, and it announces a semantics in
        propositional logic that the implementation never uses.
    5.5 Semantics of Predicate Logic:
      to: Logic/FOL
      why: The model is the four-vertex graph of Enderton, since the model of
        6.3 belongs with the fragment it interprets.
    5.6 Semantics of Natural Language Fragments:
      to: English
      why: Only its exercise 5.27 is kept. Its translation key is superseded by
        6.2, which computes the translation.
    5.7 An Inference Engine with a Natural Language Interface:
      to: InfEngine
      why: The natural-language input, the only use of IO in the book, is not
        ported.
    5.8 Further Reading: omitted

  CSwFP/6:
    6.1 Linguistic Form and Translation Into Logic: English, before 4.2
    6.2 Predicate Logic as Representation Language: English
    6.3 Representing a Model for Predicate Logic: English
    6.4 Evaluating Formulas in Models:
      to: English
      why: Absorbed. Its interpretation, assignments and eval are already in
        Logic/FOL, so English adds only the model and checkSentence.
    6.5 Evaluating Formulas with Structured Terms:
      to: Logic/FOL
      why: It is about the evaluator, not the fragment. The evaluation over
        `[0..]` becomes a theorem, since Lean is not lazy.
    6.6 Further Reading: omitted

  CSwFP/7 The Composition of Meaning in Natural Language: not yet taken up
  CSwFP/8 Extension and Intension: not yet taken up
  CSwFP/9 Parsing: not yet taken up
  CSwFP/10 Handling Relations and Scoping: not yet taken up
  CSwFP/11 Continuation Passing Style Semantics: not yet taken up
  CSwFP/12 Discourse Representation and Context: not yet taken up
  CSwFP/13 Communication as Informative Action: not yet taken up

new:
  Logic/Proof.lean: Proving in Lean, condensed from logic_and_proof. It comes
    before PL and FOL so that neither has to teach tactics.

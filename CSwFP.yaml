  Logic/Proof.lean:
    - rfl-arithmetic
    - de-morgan
    - contrapositive
    - exchange-prop
    - implication-as-disj
    - and-comm
    - implication-transitivity
    - unfold-direct-proof
    - unfold-rw-conjunction
    - dresses
    - forall-exists-swap
    - exists-witness
  Logic/PL.lean:
    - collect-atoms-alternative  # `names` without `mergeSort` and `eraseDups`
    - ex-pl-contingent
    - bangu-proof
  Logic/FOL.lean:
    - ex-fol-implies-from-list   # from the prose between 5.24 and 5.25
  Sets.lean:
    - five-in-above2
    - one-not-in-above2
    - above5-subset-above2
    - union-contains
    - intersection-contained
  SeaBattle.lean: [defeated-last]
  Morphology/Phonemes.lean: [append-suffix-text]
  Morphology/SwedishPlural.lean: [swedish-plural]
  InfEngine.lean: [inconsistent-kb, ferio]


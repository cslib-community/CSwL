# How CSwL uses CSwFP.
#
# `exercises` lists every CSwFP exercise, by chapter, with the page it is on.
# The value is the CSwL exercise it became, as its `(name := …)`, or, when it
# was not ported, the reason why. A reason is anything with a space in it; a
# `TODO` reason is a decision still to be made.
#
# `original` lists the CSwL exercises that have no CSwFP counterpart, by file.
# `depends` lists the exercises whose solution another exercise uses.
#
# `sections` says where each CSwFP section went, and why when the answer is
# not simply the obvious chapter. Chapter names are the files under `CSwL/`.
#
# `scripts/check-cswfp.py` checks this file against the book.


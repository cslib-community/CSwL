# Local serving of the book's four variants generated by `make all`
# (`_out/<variant>/{html,lean}`), with `lake exe verso-serve`.
#
# Usage:
#
#     make all              # generates _out/
#     lake exe verso-serve  # serves at http://127.0.0.1:8000/
#
# Replaces `python3 -m http.server 8000 -d _out/` (same layout: each
# variant appears as a subfolder at /, with directory listing).

banner = "CSwL — semântica computacional com Lean (variantes geradas)"

[[mounts]]
path = "/"
dir = "_out"
